name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      NEXT_PUBLIC_APP_NAME: CAF TI Helpdesk
      NEXT_PUBLIC_APP_ENV: ci
      SUPABASE_SECRET_KEY: ci-secret-placeholder
      MONDAY_API_TOKEN: ci-monday-placeholder
      MONDAY_API_VERSION: 2026-07
      MONDAY_BOARD_ID: 18389222247
      CRON_SECRET: ci-cron-placeholder-with-sufficient-length

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
